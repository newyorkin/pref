name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --experimental-sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @pref/web build

  deploy-test:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: git.yorkin.online
          username: ${{ secrets.FORGEJO_USERNAME }}
          password: ${{ secrets.FORGEJO_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: git.yorkin.online/dan4eg/pref:test-${{ github.sha }}
          build-args: |
            PREF_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Point pref-test at this image
        env:
          USERNAME: ${{ secrets.FORGEJO_USERNAME }}
          TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          auth=$(printf '%s' "${USERNAME}:${TOKEN}" | base64 -w0)
          git -c http.extraHeader="Authorization: Basic ${auth}" \
            clone --depth 1 https://git.yorkin.online/dan4eg/gitops-apps.git
          cd gitops-apps
          git config user.email "actions@yorkin.online"
          git config user.name "github-actions"
          sed -i "s|image: git.yorkin.online/dan4eg/pref:.*|image: git.yorkin.online/dan4eg/pref:test-${SHA}|" \
            apps/pref-test/deployment.yaml
          git add apps/pref-test/deployment.yaml
          if git diff --cached --quiet; then
            echo "image tag already current"
            exit 0
          fi
          git commit -m "Выкатить pref-test ${SHA}."
          git -c http.extraHeader="Authorization: Basic ${auth}" \
            push origin HEAD:main
